name: 'Production API Build'

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: 'Deploy'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
        with:
          ref: main

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build, tag, and push image to GHCR
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/asctb-api
          IMAGE_TAG: latest
        working-directory: asctb-api
        run: |
          docker build -t $GHCR_IMAGE:$IMAGE_TAG .
          docker push $GHCR_IMAGE:$IMAGE_TAG
